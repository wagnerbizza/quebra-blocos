<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quebra-Blocos Arcade Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Cabeçalho (HUD) -->
    <header class="hud">
      <div class="hud-item left">
        <span class="hud-label">RECORDE</span>
        <span id="high-score" class="hud-value">0</span>
      </div>
      <div class="hud-item center">
        <span class="hud-label">PONTOS</span>
        <span id="score" class="hud-value score-highlight">0</span>
      </div>
      <div class="hud-item right">
        <div class="hud-sub">
          <span class="hud-label">FASE</span>
          <span id="level" class="hud-value-small">1</span>
        </div>
        <div class="hud-sub">
          <span class="hud-label">VIDAS</span>
          <span id="lives" class="hud-hearts">❤️❤️❤️</span>
        </div>
      </div>
    </header>

    <!-- Canvas do Jogo -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="640" height="480"></canvas>
      
      <!-- Overlay da Contagem Regressiva -->
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-text">3</span>
      </div>
    </div>

    <!-- Controles da Interface -->
    <footer class="controls">
      <button id="pause-btn" class="btn">Pausar</button>
      <button id="restart-btn" class="btn">Recomeçar</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
