<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quebra-Blocos Arcade Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay de Início (Botão Play) -->
  <div id="start-overlay" class="start-overlay">
    <div class="start-card">
      <h1>QUEBRA-BLOCOS</h1>
      <p>Destrua todos os blocos e conquiste o ranking!</p>
      <button id="start-game-btn" class="btn-play">▶ JOGAR</button>
    </div>
  </div>

  <div class="game-container">
    <!-- Overlay da Contagem Regressiva -->
    <div id="countdown-overlay" class="hidden">
      <div id="countdown-text">3</div>
    </div>

    <!-- Painel de Controle e Status (HUD) -->
    <header class="hud">
      <div class="hud-item">
        <span class="label">PONTOS</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">RECORDE</span>
        <span id="high-score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">FASE</span>
        <span id="level">1</span>
      </div>
      <div class="hud-item">
        <span class="label">VIDAS</span>
        <span id="lives">❤️❤️❤️</span>
      </div>
    </header>

    <!-- Canvas do Jogo -->
    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <!-- Barra de Controles da Interface (Com o botão de Configurações adicionado) -->
    <footer class="controls">
      <button id="pause-btn" class="btn">Pausar</button>
      <button id="restart-btn" class="btn btn-secondary">Reiniciar</button>
      <button id="ranking-btn" class="btn btn-warning">🏆 Ranking</button>
      <button id="settings-btn" class="btn">⚙️ Configurações</button>
    </footer>

    <!-- Controles Virtuais para Celular/Touch -->
    <div class="mobile-controls">
      <button id="btn-left" class="touch-btn">◀</button>
      <button id="btn-right" class="touch-btn">▶</button>
    </div>
  </div>

  <!-- Modal de Configurações -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Configurações</h2>
      
      <div class="setting-group" style="margin: 15px 0;">
        <label for="initial-speed-select">Velocidade da Bola:</label>
        <select id="initial-speed-select" style="padding: 5px; width: 100%; margin-top: 5px;">
          <option value="3">Lento (Iniciante)</option>
          <option value="4" selected>Normal (Padrão)</option>
          <option value="5">Rápido (Avançado)</option>
          <option value="6.5">Insano (Expert)</option>
        </select>
      </div>

      <div class="setting-group checkbox-group" style="text-align: left; margin: 15px 0;">
        <label style="display:block; margin: 5px 0;"><input type="checkbox" id="sound-move" checked> Som de Raquete</label>
        <label style="display:block; margin: 5px 0;"><input type="checkbox" id="sound-eat" checked> Som de Bloco</label>
        <label style="display:block; margin: 5px 0;"><input type="checkbox" id="sound-hit" checked> Som de Vida/Morte</label>
      </div>

      <button id="close-settings-btn" class="btn">Salvar e Fechar</button>
    </div>
  </div>

  <!-- Modal do Ranking do Campeonato (Global Firebase) -->
  <div id="leaderboard-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🏆 Ranking Global (Top 5)</h2>
      <ol id="leaderboard-list">
        <li>Carregando ranking global...</li>
      </ol>
      <button id="close-leaderboard-btn" class="btn">Fechar</button>
    </div>
  </div>

  <!-- Elementos de Áudio HTML5 Nativo -->
  <audio id="sound-move-file" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
  <audio id="sound-eat-file" src="https://assets.mixkit.co/active_storage/sfx/2704/2704-preview.mp3" preload="auto"></audio>
  <audio id="sound-hit-file" src="https://assets.mixkit.co/active_storage/sfx/2658/2658-preview.mp3" preload="auto"></audio>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://quebra-blocos-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>

  <!-- Script da Lógica Principal do Jogo -->
  <script src="script.js"></script>
</body>
</html>
