<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quebra-Blocos Arcade Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Overlay da Contagem Regressiva -->
  <div id="countdown-overlay" class="hidden">
    <div id="countdown-text">3</div>
  </div>

  <div class="game-container">
    <!-- Painel de Controle e Status (HUD) -->
    <header class="hud">
      <div class="hud-item">
        <span class="label">PONTOS</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">RECORDE</span>
        <span id="high-score">0</span>
      </div>
      <div class="hud-item">
        <span class="label">FASE</span>
        <span id="level">1</span>
      </div>
      <div class="hud-item">
        <span class="label">VIDAS</span>
        <span id="lives">❤️❤️❤️</span>
      </div>
    </header>

    <!-- Canvas do Jogo -->
    <canvas id="gameCanvas" width="600" height="450"></canvas>

    <!-- Barra de Controles da Interface -->
    <footer class="controls">
      <button id="pause-btn" class="btn">Pausar</button>
      <button id="restart-btn" class="btn btn-secondary">Reiniciar</button>
      <button id="ranking-btn" class="btn btn-warning">🏆 Ranking</button>
    </footer>

    <!-- Controles Virtuais para Celular/Touch -->
    <div class="mobile-controls">
      <button id="btn-left" class="touch-btn">◀</button>
      <button id="btn-right" class="touch-btn">▶</button>
    </div>
  </div>

  <!-- Modal do Ranking do Campeonato (Global Firebase) -->
  <div id="leaderboard-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🏆 Ranking Global (Top 5)</h2>
      <ol id="leaderboard-list">
        <li>Carregando ranking global...</li>
      </ol>
      <button id="close-leaderboard-btn" class="btn">Fechar</button>
    </div>
  </div>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // Configurações do seu projeto no Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBJsmWldjy6TRSDR4vfRVS-Gijoun0d8Cc",
      authDomain: "quebra-blocos.firebaseapp.com",
      databaseURL: "https://quebra-blocos-default-rtdb.firebaseio.com",
      projectId: "quebra-blocos",
      storageBucket: "quebra-blocos.appspot.com",
      messagingSenderId: "961741884553",
      appId: "1:961741884553:web:b2c130d49c76c96f338a58"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>

  <!-- Script da Lógica Principal do Jogo -->
  <script src="script.js"></script>
</body>
</html>
